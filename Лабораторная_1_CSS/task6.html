    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        /* Обычная ссылка */
        a.demo-link {
            color: #4385f5;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 12px;
        }
        a.demo-link:visited {
            color: #ff9f43;
        }
        a.demo-link:hover {
            color: #ff5277;
        }
        a.demo-link:active {
            color: #55e655;
        }

        /* Псевдоссылка */
        .demo-pseudolink {
            color: #000000;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
        }
        .demo-pseudolink:hover {
            opacity: 0.45;
        }
        .demo-pseudolink:active {
            opacity: 1;
        }
    </style>
</head>
